<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LarryVision AI | Sign In</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #080812;
    color: white;
}

.card {
    width: 100%;
    max-width: 420px;
    padding: 30px;
    background: #121225;
    border: 1px solid #34345a;
    border-radius: 18px;
    box-shadow: 0 0 35px #5335ff20;
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #a56bff;
}

.tagline {
    text-align: center;
    color: #aaaac4;
    margin-bottom: 28px;
    font-size: 14px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
}

.tabs button {
    flex: 1;
    padding: 12px;
    background: #20203a;
    color: white;
    border: 1px solid #37375c;
    border-radius: 8px;
}

.tabs button.active {
    background: linear-gradient(90deg, #4169ff, #963fff);
    border: none;
}

label {
    display: block;
    margin: 15px 0 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    color: white;
    background: #090917;
    border: 1px solid #39395e;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #8765ff;
}

.submit {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: linear-gradient(90deg, #4169ff, #963fff);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
}

#message {
    color: #c5baff;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
}

.small {
    color: #aaaac4;
    font-size: 13px;
    text-align: center;
    margin-top: 20px;
}

a {
    color: #a58bff;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    text-decoration: none;
}
</style>
</head>

<body>

<main class="card">

    <div class="logo">
        LarryVision <span>AI</span>
    </div>

    <p class="tagline">
        Imagine It. Create It. See It.
    </p>

    <div class="tabs">
        <button id="loginTab"
        class="active" onclick="setMode('login')">
            Sign In
        </button>

        <button id="registerTab"
        onclick="setMode('register')">
            Create Account
        </button>
    </div>

    <form id="authForm">

        <div id="nameField" hidden>
            <label for="name">Full Name</label>
            <input id="name" type="text"
            autocomplete="name">
        </div>

        <label for="email">Email Address</label>
        <input id="email" type="email"
        placeholder="you@example.com"
        autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
        placeholder="Enter your password"
        minlength="8" autocomplete="current-password"
        required>

        <button class="submit" id="submitButton"
        type="submit">
            Sign In
        </button>

    </form>

    <p id="forgot" class="small">
        <a href="#" onclick="showRecovery(event)">
            Forgot your password?
        </a>
    </p>

    <p id="message" aria-live="polite"></p>

    <a class="back" href="index.html">
        ← Back to LarryVision Home
    </a>

    <p class="small">
        LarryVision Technologies © 2026
    </p>

</main>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "const SUPABASE_URL = "https://ydswbvrzryzkufhcoglc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_sPzowpdcmWMK4Lo7CUZFNQ_Mitp67g9"";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_sPzowpdcmWMK4Lo7CUZFNQ_Mitp67g9";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let currentMode = "login";

function setMode(mode) {
    currentMode = mode;

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("name");
    const submitButton = document.getElementById("submitButton");
    const forgot = document.getElementById("forgot");
    const password = document.getElementById("password");
    const message = document.getElementById("message");

    loginTab.classList.toggle("active", mode === "login");
    registerTab.classList.toggle("active", mode === "register");

    nameField.hidden = mode !== "register";
    nameInput.required = mode === "register";

    password.autocomplete =
        mode === "register" ? "new-password" : "current-password";

    submitButton.textContent =
        mode === "register" ? "Create Account" : "Sign In";

    forgot.hidden = mode === "register";
    message.textContent = "";
}

function showRecovery(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");

    if (!email) {
        message.textContent =
            "Enter your email address first, then tap Forgot your password again.";
        return;
    }

    supabaseClient.auth.resetPasswordForEmail(email)
        .then(({ error }) => {
            message.textContent = error
                ? error.message
                : "If an account exists for this email, password recovery instructions will be sent.";
        })
        .catch(() => {
            message.textContent =
                "Unable to request password recovery. Please try again.";
        });
}

document.getElementById("authForm").addEventListener(
    "submit",
    async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const name = document.getElementById("name").value.trim();
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        if (currentMode === "register" && !name) {
            message.textContent = "Please enter your full name.";
            return;
        }

        submitButton.disabled = true;
        message.textContent = "Please wait...";

        try {
            let result;

            if (currentMode === "register") {
                result = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name
                        }
                    }
                });
            } else {
                result = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
            }

            if (result.error) {
                message.textContent = result.error.message;
                return;
            }

            if (currentMode === "register") {
                if (result.data.session) {
                    message.textContent = "Account created successfully!";
                    window.location.href = "dashboard.html";
                } else {
                    message.textContent =
                        "Registration received. Check your email to confirm your account before signing in.";
                }
            } else {
                message.textContent = "Sign in successful!";
                window.location.href = "dashboard.html";
            }

        } catch (error) {
            message.textContent =
                "Unable to connect. Check your internet connection and try again.";
            console.error(error);
        } finally {
            submitButton.disabled = false;

            submitButton.textContent =
                currentMode === "register" ? "Create Account" : "Sign In";
        }
    }
);

setMode("login");
</script>
    
</body>
</html>
