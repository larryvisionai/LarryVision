<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LarryVision AI | Sign In</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #080812;
    color: white;
}

.card {
    width: 100%;
    max-width: 420px;
    padding: 30px;
    background: #121225;
    border: 1px solid #34345a;
    border-radius: 18px;
    box-shadow: 0 0 35px #5335ff20;
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 10px;
}

.logo span {
    color: #a56bff;
}

.tagline {
    text-align: center;
    color: #aaaac4;
    margin-bottom: 28px;
    font-size: 14px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
}

.tabs button {
    flex: 1;
    padding: 12px;
    background: #20203a;
    color: white;
    border: 1px solid #37375c;
    border-radius: 8px;
}

.tabs button.active {
    background: linear-gradient(90deg, #4169ff, #963fff);
    border: none;
}

label {
    display: block;
    margin: 15px 0 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    color: white;
    background: #090917;
    border: 1px solid #39395e;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #8765ff;
}

.submit {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: linear-gradient(90deg, #4169ff, #963fff);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
}

#message {
    color: #c5baff;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
}

.small {
    color: #aaaac4;
    font-size: 13px;
    text-align: center;
    margin-top: 20px;
}

a {
    color: #a58bff;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    text-decoration: none;
}
</style>
</head>

<body>

<main class="card">

    <div class="logo">
        LarryVision <span>AI</span>
    </div>

    <p class="tagline">
        Imagine It. Create It. See It.
    </p>

    <div class="tabs">
        <button id="loginTab"
        class="active" onclick="setMode('login')">
            Sign In
        </button>

        <button id="registerTab"
        onclick="setMode('register')">
            Create Account
        </button>
    </div>

    <form id="authForm">

        <div id="nameField" hidden>
            <label for="name">Full Name</label>
            <input id="name" type="text"
            autocomplete="name">
        </div>

        <label for="email">Email Address</label>
        <input id="email" type="email"
        placeholder="you@example.com"
        autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
        placeholder="Enter your password"
        minlength="8" autocomplete="current-password"
        required>

        <button class="submit" id="submitButton"
        type="submit">
            Sign In
        </button>

    </form>

    <p id="forgot" class="small">
        <a href="#" onclick="showRecovery(event)">
            Forgot your password?
        </a>
    </p>

    <p id="message" aria-live="polite"></p>

    <a class="back" href="index.html">
        ← Back to LarryVision Home
    </a>

    <p class="small">
        LarryVision Technologies © 2026
    </p>

</main>

<script>
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://ydswbvrzryzkufhcoglc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_sPzowpdcmWMK4Lo7CUZFNQ_Mitp67g9";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

document.addEventListener("DOMContentLoaded", function () {
    const buttons = document.querySelectorAll("button");

    buttons.forEach(function (button) {
        if (button.textContent.trim().toLowerCase().includes("create account")) {
            button.addEventListener("click", async function (event) {
                event.preventDefault();

                const emailInput = document.querySelector(
                    'input[type="email"]'
                );

                const passwordInput = document.querySelector(
                    'input[type="password"]'
                );

                if (!emailInput || !passwordInput) {
                    alert("Email or password field not found.");
                    return;
                }

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    alert("Please enter your email and password.");
                    return;
                }

                button.disabled = true;
                button.textContent = "Creating account...";

                try {
                    const { data, error } =
                        await supabaseClient.auth.signUp({
                            email: email,
                            password: password
                        });

                    if (error) {
                        alert("Registration failed: " + error.message);
                        return;
                    }

                    alert(
                        "Account request successful! Check your email " +
                        "if confirmation is required."
                    );

                    if (data.session) {
                        window.location.href = "dashboard.html";
                    }
                } catch (error) {
                    alert("Something went wrong. Please try again.");
                    console.error(error);
                } finally {
                    button.disabled = false;
                    button.textContent = "Create Account";
                }
            });
        }
    });
});
</script> 

</body>
</html>
